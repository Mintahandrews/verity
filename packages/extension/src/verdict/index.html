<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verity - Verdict</title>
    <style>
      body {
        font-family: var(--font-ui);
        font-size: var(--text-body-md);
        line-height: 1.5;
        letter-spacing: -0.031em;
        margin: 0;
        background: var(--color-pure-white);
        color: var(--color-onyx-olive);
      }
      main { max-width: 640px; margin: var(--space-5) auto; padding: 0 var(--space-2); }
      .card {
        background: var(--color-bone-white);
        border: 1px solid var(--color-pale-fern);
        border-radius: var(--radius-card);
        padding: var(--space-4);
      }
      .wordmark {
        font-size: var(--text-caption);
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--color-lichen-sage);
        margin-bottom: var(--space-2);
      }
      .chip {
        display: inline-block;
        padding: 4px 14px;
        border-radius: var(--radius-badge);
        font-weight: 600;
        font-size: var(--text-caption);
        letter-spacing: 0.03em;
      }
      .chip.verified { background: var(--color-electric-sprout); color: var(--color-carbon); }
      .chip.unverified { background: var(--color-cool-stone); color: var(--color-onyx-olive); }
      .chip.suspicious { background: var(--color-onyx-olive); color: var(--color-pure-white); }
      .chip.failed { background: var(--color-soft-mist); color: var(--color-carbon); }
      h1 {
        font-size: var(--text-heading);
        font-weight: 700;
        line-height: 1.33;
        letter-spacing: var(--tracking-tight);
        margin: var(--space-2) 0 4px;
      }
      .when { color: var(--color-lichen-sage); font-size: var(--text-caption); }
      .signal { border-top: 1px solid var(--color-mist-green); padding: var(--space-2) 0; }
      .signal h2 { font-size: var(--text-body); font-weight: 600; margin: 0 0 2px; }
      .signal .summary { margin: 0 0 6px; color: var(--color-moss-shadow); }
      .signal ul { margin: 0; padding-left: 18px; color: var(--color-lichen-sage); font-size: 13px; }
      .outcome { font-weight: 700; margin-right: 6px; }
      .outcome.positive { color: var(--color-deep-verdant); }
      .outcome.negative { color: var(--color-carbon); }
      .outcome.neutral, .outcome.unsupported { color: var(--color-lichen-sage); }
      .outcome.error { color: var(--color-carbon); }
      .share { margin: var(--space-2) 0 0; font-size: var(--text-caption); }
      .share a { color: var(--color-deep-verdant); text-decoration: none; border-bottom: 1px solid var(--color-mist-green); }
      footer {
        max-width: 640px;
        margin: var(--space-2) auto;
        padding: 0 var(--space-2);
        font-family: var(--font-accent);
        font-size: var(--text-body-md);
        color: var(--color-lichen-sage);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" id="card"><p>Loading…</p></div>
    </main>
    <footer>
      Verity never labels media “fake”. Unverified means we couldn’t confirm
      provenance - not that the content is false.
    </footer>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
