<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 240px; font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; color: #0f172a; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #64748b; font-size: 12px; margin: 0 0 12px; }
      button { width: 100%; padding: 8px; font: 600 13px system-ui; color: #fff; background: #312e81; border: 0; border-radius: 6px; cursor: pointer; }
      button:hover { background: #4338ca; }
      .stats { margin-top: 12px; font-size: 12px; color: #64748b; }
      .hint { margin-top: 8px; font-size: 11px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <h1>Verity</h1>
    <p class="sub">What can we verify? Not just "is it fake".</p>
    <button id="scan">Scan this page</button>
    <p class="stats">Media checked: <span id="count">0</span></p>
    <p class="hint">Or right-click any image → “Verify with Verity”.</p>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
