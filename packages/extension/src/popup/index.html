<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 288px;
        margin: 0;
        padding: var(--space-3);
        font-family: var(--font-ui);
        font-size: var(--text-body);
        line-height: 1.5;
        letter-spacing: -0.003em;
        background: var(--color-forest-depths);
        color: var(--color-pure-white);
        border: 1px solid var(--color-onyx-olive);
      }
      h1 {
        margin: 0 0 4px;
        font-size: var(--text-heading-sm);
        font-weight: 700;
        letter-spacing: var(--tracking-tight);
      }
      h1 em {
        font-family: var(--font-accent);
        font-weight: 400;
        color: var(--color-electric-sprout);
      }
      .sub {
        margin: 0 0 var(--space-2);
        font-size: var(--text-caption);
        color: var(--color-lichen-sage);
      }
      button {
        width: 100%;
        padding: 10px var(--space-2);
        font-family: var(--font-ui);
        font-size: var(--text-body);
        font-weight: 600;
        color: var(--color-carbon);
        background: var(--color-electric-sprout);
        border: 0;
        border-radius: var(--radius-button-pill);
        cursor: pointer;
      }
      button:hover { background: var(--color-sprout-wash); }
      .stats, .hint {
        margin: var(--space-2) 0 0;
        font-size: var(--text-caption);
        color: var(--color-lichen-sage);
      }
      .hint { color: var(--color-moss-shadow); }
      .stats b { color: var(--color-electric-sprout); font-weight: 600; }
      .opt {
        display: flex; gap: 8px; align-items: flex-start;
        margin-top: var(--space-2); font-size: var(--text-caption);
        line-height: 1.4;
        color: var(--color-lichen-sage); cursor: pointer;
      }
      .opt + .opt { padding-top: var(--space-1); border-top: 1px solid var(--color-onyx-olive); }
      .opt input { accent-color: var(--color-electric-sprout); margin-top: 2px; flex-shrink: 0; }
      .opt .opt-body { display: flex; flex-direction: column; min-width: 0; color: var(--color-lichen-sage); }
      .opt .opt-body small { color: var(--color-moss-shadow); font-size: 11px; margin-top: 1px; }
      .status { margin: 8px 0 0; font-size: var(--text-caption); color: var(--color-signal-warn, #e5b567); display: none; }
    </style>
  </head>
  <body>
    <h1>Verity <em>checks</em></h1>
    <p class="sub">What can we verify - not just “is it fake”.</p>
    <button id="scan">Scan this page</button>
    <p class="status" id="status"></p>
    <label class="opt"><input type="checkbox" id="rs" /><span class="opt-body">Reverse-search public image URLs<small>(sends URL to Google Lens)</small></span></label>
    <label class="opt"><input type="checkbox" id="geo" /><span class="opt-body">Location cross-check<small>(sends embedded GPS to a geocoder)</small></span></label>
    <label class="opt"><input type="checkbox" id="ocr" /><span class="opt-body">Extract text from images<small>(local OCR - helps fact-check memes)</small></span></label>
    <label class="opt"><input type="checkbox" id="ai" /><span class="opt-body">AI classifier<small>(experimental - downloads ~85MB model once)</small></span></label>
    <p class="stats">Media checked: <b id="count">0</b></p>
    <p class="hint">Or right-click any image → “Verify with Verity”.</p>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
